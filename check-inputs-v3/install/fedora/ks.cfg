# Fedora Workstation 45 installation from the verified official live payload.
text
lang en_US.UTF-8
keyboard us
timezone UTC --utc
rootpw --lock
user --name=user --password=cal-test --plaintext --groups=wheel
network --bootproto=dhcp --device=link --activate
zerombr
clearpart --all --initlabel --drives=vda
autopart
bootloader --append="console=tty0 console=ttyS0,115200n8"
liveimg --url=http://10.0.2.2:18081/fedora/squashfs.img
firstboot --disable
poweroff
