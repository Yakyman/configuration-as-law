d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i time/zone string Etc/UTC
d-i clock-setup/utc boolean true
d-i netcfg/get_hostname string cal-test
d-i passwd/user-fullname string User
d-i passwd/username string user
d-i passwd/user-password password cal-test
d-i passwd/user-password-again password cal-test
d-i user-setup/allow-password-weak boolean true
d-i user-setup/encrypt-home boolean false
d-i partman-auto/disk string /dev/vda
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i grub-installer/bootdev string /dev/vda
ubiquity ubiquity/use_nonfree boolean false
ubiquity ubiquity/download_updates boolean false
ubiquity ubiquity/reboot boolean false
ubiquity ubiquity/poweroff boolean true
ubiquity ubiquity/success_command string in-target sh -c 'printf "GRUB_CMDLINE_LINUX=\"console=tty0 console=ttyS0,115200n8\"\n" > /etc/default/grub.d/99-cal-console.cfg; update-grub; systemctl enable serial-getty@ttyS0.service'
